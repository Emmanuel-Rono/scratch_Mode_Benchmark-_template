name: benchmark-template-ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/self_test.py
      - run: python scripts/validate_task.py task_template
      - run: python scripts/validate_task.py example

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t benchmark-template .
      - run: docker run --rm benchmark-template
      - run: docker run --rm benchmark-template python scripts/validate_task.py task_template
      - run: docker run --rm benchmark-template python scripts/validate_task.py example

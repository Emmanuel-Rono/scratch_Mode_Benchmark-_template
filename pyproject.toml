[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-benchmark-task-template"
version = "0.1.0"
description = "Domain-agnostic task packaging and verification template for AI benchmarks"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.2"]

[tool.setuptools]
packages = ["benchmark_core", "benchmark_core.adapters"]
